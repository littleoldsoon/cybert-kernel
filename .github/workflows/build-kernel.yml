name: build-cybert-kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
      - name: Fetch kernel source (cybert / MT6897, 6.1.115)
        run: |
          git clone --depth 1 --branch MMI-W1VV36H.7-21-5 \
            https://github.com/MotorolaMobilityLLC/kernel-mtk.git ksrc
      - name: Sync f2fs from v6.6
        run: |
          cd /tmp
          rm -rf f2fs66 && mkdir f2fs66 && cd f2fs66
          git init -q
          git remote add origin https://github.com/torvalds/linux
          git sparse-checkout init --cone
          git sparse-checkout set fs/f2fs
          git fetch --depth 1 --filter=blob:none origin v6.6
          git checkout FETCH_HEAD
          rsync -a --delete fs/f2fs/ "$GITHUB_WORKSPACE/ksrc/fs/f2fs/"
          if grep -q "sbi->sb->s_mode" "$GITHUB_WORKSPACE/ksrc/fs/f2fs/super.c"; then
            echo "ERROR: f2fs 6.6 sync did NOT apply"; exit 1
          fi
      - name: Patch f2fs defaults
        run: |
          cd ksrc
          python3 - <<'PY'
          p='fs/f2fs/super.c'
          s=open(p).read()
          a='\tset_opt(sbi, NOHEAP);\n\tset_opt(sbi, MERGE_CHECKPOINT);\n'
          assert s.count(a)==1, s.count(a)
          s=s.replace(a, a+'\tset_opt(sbi, GC_MERGE);\n\tset_opt(sbi, AGE_EXTENT_CACHE);\n',1)
          open(p,'w').write(s)
          print('f2fs defaults patched')
          PY
      - name: Patch dyn_fsync
        run: |
          cd ksrc
          python3 - <<'PY'
          p='fs/sync.c'
          s=open(p).read()
          a='int vfs_fsync_range(struct file *file, loff_t start, loff_t end, int datasync)\n{\n\tstruct inode *inode = file->f_mapping->host;\n'
          assert s.count(a)==1
          s=s.replace(a, a+'\tif (!dyn_fsync_enabled)\n\t\treturn 0;\n\n',1)
          b='/**\n * vfs_fsync_range - helper to sync a range of data & metadata to disk'
          assert s.count(b)==1
          s=s.replace(b,'int dyn_fsync_enabled __read_mostly = 1;\n\n'+b,1)
          open(p,'w').write(s)
          p='kernel/sysctl.c'
          s=open(p).read()
          c='static struct ctl_table vm_table[] = {'
          assert s.count(c)==1
          s=s.replace(c,'extern int dyn_fsync_enabled;\n\n'+c,1)
          d='\t\t.extra2\t\t= SYSCTL_TWO_HUNDRED,\n\t},\n#ifdef CONFIG_NUMA\n'
          assert s.count(d)==1
          e='\t\t.extra2\t\t= SYSCTL_TWO_HUNDRED,\n\t},\n\t{\n\t\t.procname\t= "dyn_fsync",\n\t\t.data\t\t= &dyn_fsync_enabled,\n\t\t.maxlen\t\t= sizeof(int),\n\t\t.mode\t\t= 0644,\n\t\t.proc_handler\t= proc_dointvec_minmax,\n\t\t.extra1\t\t= SYSCTL_ZERO,\n\t\t.extra2\t\t= SYSCTL_ONE,\n\t},\n#ifdef CONFIG_NUMA\n'
          s=s.replace(d,e,1)
          open(p,'w').write(s)
          print('dyn_fsync patched')
          PY
      - name: Patch f2fs 6.6 compat
        run: |
          cd ksrc
          python3 - <<'PY'
          import re
          # 1) fgf_t
          p='include/linux/pagemap.h'
          s=open(p).read()
          if 'typedef unsigned int fgf_t;' not in s:
              a='#define FGP_ACCESSED'
              assert s.count(a)==1, s.count(a)
              s=s.replace(a,'typedef unsigned int fgf_t;\n\n'+a,1)
              open(p,'w').write(s)
          # 2) f2fs.h shims
          p='fs/f2fs/f2fs.h'
          s=open(p).read()
          a='#include <linux/fsverity.h>'
          assert s.count(a)==1, s.count(a)
          shim=('\n/* ---- 6.6 f2fs on 6.1 compat ---- */\n'
                '#include <linux/fs.h>\n'
                '#include <linux/mm.h>\n'
                '#define mnt_idmap user_namespace\n'
                '#define nop_mnt_idmap init_user_ns\n'
                '#define file_mnt_idmap(filp) file_mnt_user_ns(filp)\n'
                '#define vmf_fs_error vmf_error\n'
                '#define filemap_splice_read generic_file_splice_read\n')
          s=s.replace(a, a+shim,1)
          s=s.replace('static inline bool is_dot_dotdot(const u8 *name, size_t len)',
                      'static inline bool f2fs_is_dot_dotdot_compat(const u8 *name, size_t len)',1)
          open(p,'w').write(s)
          # 3) super.c blkdev 调用点（严格匹配）
          p='fs/f2fs/super.c'
          s=open(p).read()
          s=re.sub(r'blkdev_get_by_path\(\s*([^,\n]+),\s*([^,\n]+),\s*([^,\n]+),\s*NULL\s*\)',
                   r'blkdev_get_by_path(\1, \2, \3)', s)
          s=re.sub(r'blkdev_put\(\s*([^,\n]+),\s*sbi->sb\s*\)',
                   r'blkdev_put(\1, FMODE_READ | FMODE_WRITE)', s)
          open(p,'w').write(s)
          # 4) file.c：generic_fillattr / get_acl / posix_acl_chmod
          p='fs/f2fs/file.c'
          s=open(p).read()
          s=s.replace('generic_fillattr(idmap, request_mask, inode, stat);',
                      'generic_fillattr(idmap, inode, stat);')
          s=s.replace('.get_inode_acl', '.get_acl')
          s=s.replace('posix_acl_chmod(idmap, dentry,', 'posix_acl_chmod(idmap, inode,')
          open(p,'w').write(s)
          # 5) acl.c：set_acl 改收 inode
          p='fs/f2fs/acl.c'
          s=open(p).read()
          a=('int f2fs_set_acl(struct mnt_idmap *idmap, struct dentry *dentry,\n'
             '\t\t struct posix_acl *acl, int type)\n'
             '{\n\tstruct inode *inode = d_inode(dentry);\n')
          assert s.count(a)==1, s.count(a)
          s=s.replace(a,
             ('int f2fs_set_acl(struct mnt_idmap *idmap, struct inode *inode,\n'
              '\t\t struct posix_acl *acl, int type)\n{\n'),1)
          open(p,'w').write(s)
          # 6) acl.h 原型
          p='fs/f2fs/acl.h'
          s=open(p).read()
          a='extern int f2fs_set_acl(struct mnt_idmap *, struct dentry *,'
          assert s.count(a)==1, s.count(a)
          s=s.replace(a,'extern int f2fs_set_acl(struct mnt_idmap *, struct inode *,',1)
          open(p,'w').write(s)
          # 7) 自检
          bad=[f for f in ('fs/f2fs/super.c','fs/f2fs/file.c') if 'f2fs_err(sbi)' in open(f).read()]
          if bad: raise SystemExit('SUSPECT: '+','.join(bad))
          print('f2fs 6.6 compat applied')
          PY
      - name: Fetch AOSP clang r487747c
        run: |
          mkdir clangrepo && cd clangrepo
          git init -q
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git sparse-checkout init --cone
          git sparse-checkout set clang-r487747c
          git fetch --depth 1 --filter=blob:none origin android14-release
          git checkout FETCH_HEAD
          ./clang-r487747c/bin/clang --version
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y bison flex bc libelf-dev libssl-dev dwarves rsync
      - name: Configure
        run: |
          export PATH=$PWD/clangrepo/clang-r487747c/bin:$PATH
          cd ksrc
          make ARCH=arm64 LLVM=1 O=out gki_defconfig
          scripts/config --file out/.config -d LOCALVERSION_AUTO
          scripts/config --file out/.config --set-str LOCALVERSION "-android14-11-g32fd20834ef3-ab13251582"
          scripts/config --file out/.config -e TCP_CONG_ADVANCED -e TCP_CONG_BBR -e NET_SCH_CAKE -e NET_SCH_FQ -e NET_SCH_FQ_CODEL -e NET_SCH_INGRESS -e NET_CLS_ACT -e CRYPTO_LZ4HC -d WERROR -d LTO_NONE -d LTO_CLANG_FULL -e LTO_CLANG_THIN -d TRIM_UNUSED_KSYMS
          make ARCH=arm64 LLVM=1 O=out olddefconfig
      - name: Dump f2fs context
        if: always()
        run: |
          sed -n '4105,4135p' ksrc/fs/f2fs/super.c
          grep -n "f2fs_err(sbi)" ksrc/fs/f2fs/super.c || true
      - name: Build
        run: |
          export PATH=$PWD/clangrepo/clang-r487747c/bin:$PATH
          cd ksrc
          make ARCH=arm64 LLVM=1 O=out -j$(nproc) Image Image.lz4 modules 2>&1 | tee build.log
          ls -l out/arch/arm64/boot/
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybert-kernel-image
          include-hidden-files: true
          path: |
            ksrc/out/arch/arm64/boot/Image
            ksrc/out/arch/arm64/boot/Image.lz4
            ksrc/out/.config
            ksrc/out/include/generated/utsrelease.h
            ksrc/out/Module.symvers
            ksrc/build.log
            ksrc/fs/f2fs/super.c
            ksrc/fs/f2fs/f2fs.h
